<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PMTiles Indre-et-Loire - Cote a cote</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #status {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.95); padding: 6px 14px; border-radius: 8px;
    font-size: 13px; z-index: 9999; box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  #detail {
    position: fixed; bottom: 24px; right: 15px; z-index: 9999;
    width: 260px; padding: 16px 20px; border-radius: 14px;
    background: rgba(255,255,255,0.96); box-shadow: 0 14px 45px rgba(15,23,42,0.28);
    border-left: 6px solid transparent;
    opacity: 0; transform: translateY(14px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  #detail.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #detail .name { font-size: 17px; font-weight: 800; margin-bottom: 10px; }
  #detail .stats { display: flex; gap: 18px; }
  #detail .stat b { display: block; font-size: 20px; }
  #detail .stat span { font-size: 10px; color: #6b7280; text-transform: uppercase; }
  #detail .surface { margin-top: 10px; font-size: 12px; color: #374151; line-height: 1.4; }
  #detail .surface .label { color: #6b7280; text-transform: uppercase; font-size: 10px; margin-right: 6px; }
  #detail .profile { margin-top: 14px; }
  #detail .profile svg { width: 100%; height: 52px; display: block; }
  #detail .profile-range {
    display: flex; justify-content: space-between;
    font-size: 10.5px; color: #9ca3af; margin-top: 2px;
  }

  #select-btn {
    position: fixed; top: 12px; right: 15px; z-index: 9999;
    background: rgba(255,255,255,0.95); border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.2); font-family: inherit;
  }
  #select-btn.active { background: #2563eb; color: white; }
  #select-btn.disabled { opacity: 0.45; cursor: not-allowed; }

  /* filtre global par revetement : barre de pastilles sous le bandeau du haut */
  #chips {
    position: fixed; top: 58px; left: 50%; transform: translateX(-50%);
    z-index: 9999; display: flex; gap: 6px; max-width: calc(100vw - 30px);
    overflow-x: auto; scrollbar-width: none; padding: 2px 2px 6px;
  }
  #chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border: 1px solid rgba(15,23,42,0.08); border-radius: 999px;
    background: rgba(255,255,255,0.96); color: #374151; font: inherit; font-size: 12.5px;
    font-weight: 600; cursor: pointer; white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,.15); transition: background .12s, color .12s;
  }
  .chip:hover { background: #fff; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1.5px rgba(255,255,255,0.9); }
  .chip.on { background: #2563eb; border-color: #2563eb; color: #fff; }
  .chip.on:hover { background: #1d4ed8; }

  #select-rect {
    position: fixed; z-index: 9998; pointer-events: none;
    border: 2px dashed #2563eb; background: rgba(37,99,235,0.10);
    display: none;
  }

  #select-msg {
    position: fixed; top: 50px; right: 15px; z-index: 9999;
    background: rgba(17,24,39,0.92); color: #fff; padding: 7px 12px;
    border-radius: 8px; font-size: 12px; max-width: 230px; display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }

  #panel {
    position: fixed; top: 60px; right: 15px; z-index: 9999;
    width: 260px; max-height: 65vh; display: none; flex-direction: column;
    background: rgba(255,255,255,0.96); border-radius: 14px;
    box-shadow: 0 14px 45px rgba(15,23,42,0.28); overflow: hidden;
  }
  #panel-header {
    padding: 12px 16px; border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex; align-items: center; justify-content: space-between;
  }
  #panel-header .title { font-weight: 700; font-size: 14px; }
  #panel-header .sub { font-size: 12px; color: #6b7280; margin-top: 2px; }
  #panel-close { cursor: pointer; color: #9ca3af; font-size: 18px; line-height: 1; }
  #panel-close:hover { color: #374151; }
  #panel-list { list-style: none; margin: 0; padding: 6px 0; overflow-y: auto; }
  #panel-list li {
    display: flex; align-items: center; gap: 10px; padding: 7px 16px;
    cursor: pointer; transition: background .12s;
  }
  #panel-list li:hover { background: rgba(37,99,235,0.07); }
  #panel-list .rank {
    flex: none; width: 20px; height: 20px; border-radius: 50%; color: white;
    font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  #panel-list .name { font-weight: 600; font-size: 12.5px; line-height: 1.25; }
  #panel-list .stats { color: #6b7280; font-size: 11px; margin-top: 1px; }
  #panel-empty { padding: 16px; font-size: 12.5px; color: #6b7280; }

  /* ecrans tactiles : cibles plus grandes, pas de selection de texte parasite */
  @media (pointer: coarse) {
    #select-btn { padding: 12px 16px; font-size: 14px; }
    #panel-close { font-size: 28px; padding: 4px 8px; margin: -4px -8px -4px 0; }
    #panel-list li { padding: 12px 16px; }
    .chip { padding: 9px 14px; font-size: 13.5px; }
    #panel-list .rank { width: 24px; height: 24px; font-size: 11px; }
    #panel-list .name { font-size: 14px; }
    #panel-list .stats { font-size: 12px; }
  }

  /* telephone / petite fenetre : panneaux en "bottom sheet", barre du haut compacte */
  @media (max-width: 640px) {
    #status {
      top: 8px; left: 8px; right: 140px; transform: none;
      font-size: 11.5px; padding: 6px 10px; line-height: 1.3;
    }
    #select-btn { top: 8px; right: 8px; padding: 10px 12px; }
    /* pastilles sur toute la largeur, defilables horizontalement */
    #chips { top: 70px; left: 0; right: 0; transform: none; max-width: none; padding: 2px 8px 6px; }
    #select-msg { top: 52px; right: 8px; left: 8px; max-width: none; font-size: 13px; }
    #detail {
      left: 8px; right: 8px; width: auto; box-sizing: border-box;
      padding: 12px 16px;
    }
    #detail .name { font-size: 16px; margin-bottom: 6px; }
    #detail .profile { margin-top: 8px; }
    /* liste de la zone : bottom sheet (deux etats : ouverte / repliee sur l'en-tete) */
    #panel {
      top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 50vh;
      border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -8px 30px rgba(15,23,42,0.22);
    }
    #panel-header { position: relative; padding-top: 20px; cursor: pointer; }
    #panel-header::before {
      content: ""; position: absolute; top: 8px; left: 50%; width: 36px; height: 4px;
      margin-left: -18px; border-radius: 2px; background: #d1d5db;
    }
    #panel.collapsed #panel-list { display: none; }
    #panel.collapsed #panel-header { border-bottom: none; }
    /* la fiche d'une cote se pose juste au-dessus de la feuille */
    #detail { bottom: calc(var(--sheet-h, 0px) + 8px + env(safe-area-inset-bottom)); }
    .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { z-index: 1; }
  }
</style>
</head>
<body>
<div id="status">chargement...</div>
<button id="select-btn">&#9635; Selectionner une zone</button>
<div id="chips" role="group" aria-label="Filtrer par revêtement"></div>
<div id="select-rect"></div>
<div id="select-msg"></div>
<div id="panel">
  <div id="panel-header">
    <div>
      <div class="title">Cotes de la zone</div>
      <div class="sub" id="panel-sub"></div>
    </div>
    <span id="panel-close">&times;</span>
  </div>
  <ul id="panel-list"></ul>
</div>
<div id="detail"></div>
<div id="map"></div>
<script>
  const pmProtocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", pmProtocol.tile);

  // Fond de plan : OpenFreeMap (gratuit, sans cle). Les tuiles raster CARTO
  // gratuites affichent desormais un filigrane "API key required".
  const map = new maplibregl.Map({
    container: "map",
    center: [2.8, 46.4],
    zoom: 5.7,
    style: "https://tiles.openfreemap.org/styles/positron",
  });

  // Les couches de cotes s'ajoutent par-dessus le style du fond de plan.
  map.on("style.load", () => {
    map.addSource("climbs", {
      type: "vector",
      url: "pmtiles://climbs_france_2026-10-16.pmtiles",
      promoteId: "idx",
    });
    const lineLayout = { "line-cap": "round", "line-join": "round" };
    map.addLayer({
      id: "climbs-line",
      type: "line",
      source: "climbs",
      "source-layer": "climbs",
      layout: lineLayout,
      paint: {
        "line-color": ["get", "color"],
        "line-width": ["case", ["boolean", ["feature-state", "hover"], false], 6, 2.5],
        "line-opacity": 0.85,
      },
    });
    map.addLayer({
      id: "climbs-zone",
      type: "line",
      source: "climbs",
      "source-layer": "climbs",
      layout: lineLayout,
      filter: ["in", ["get", "idx"], ["literal", []]],
      paint: { "line-color": ["get", "color"], "line-width": 5, "line-opacity": 1 },
    });
    map.addLayer({
      id: "climbs-halo",
      type: "line",
      source: "climbs",
      "source-layer": "climbs",
      layout: lineLayout,
      filter: ["==", ["get", "idx"], -1],
      paint: { "line-color": ["get", "color"], "line-width": 13, "line-opacity": 0.32 },
    });
  });

  const statusEl = document.getElementById("status");
  const detailEl = document.getElementById("detail");

  let hoveredId = null;
  let selectedId = null;
  const N_CLIMBS = 313801; // France + Corse, calcule depuis le PBF OSRM pretraite (elevations precalculees)

  map.on("load", () => {
    statusEl.textContent = N_CLIMBS + " cotes (France + Corse) - survolez, cliquez, ou selectionnez une zone";
  });

  map.on("mousemove", "climbs-line", (e) => {
    if (!e.features.length) return;
    map.getCanvas().style.cursor = "pointer";
    const f = e.features[0];
    if (hoveredId !== null && hoveredId !== f.id) {
      map.setFeatureState({ source: "climbs", sourceLayer: "climbs", id: hoveredId }, { hover: false });
    }
    hoveredId = f.id;
    map.setFeatureState({ source: "climbs", sourceLayer: "climbs", id: hoveredId }, { hover: true });
  });

  map.on("mouseleave", "climbs-line", () => {
    map.getCanvas().style.cursor = "";
    if (hoveredId !== null) {
      map.setFeatureState({ source: "climbs", sourceLayer: "climbs", id: hoveredId }, { hover: false });
    }
    hoveredId = null;
  });

  function lineBounds(geometry) {
    const lines = geometry.type === "MultiLineString" ? geometry.coordinates : [geometry.coordinates];
    let minLng = Infinity, minLat = Infinity, maxLng = -Infinity, maxLat = -Infinity;
    for (const line of lines) {
      for (const [lng, lat] of line) {
        if (lng < minLng) minLng = lng;
        if (lng > maxLng) maxLng = lng;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
      }
    }
    return [[minLng, minLat], [maxLng, maxLat]];
  }

  const PROFILE_COLORS = ["#37b24d", "#f7b731", "#f2762e", "#e63946"];

  function profileSvg(profileStr, gradesStr, fallbackColor) {
    const vals = (profileStr || "").split(",").map(Number).filter((v) => !isNaN(v));
    if (vals.length < 2) return "";
    const grades = (gradesStr || "").split(",").map(Number);
    const w = 260, h = 60, pad = 2;
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = Math.max(max - min, 1);
    const pts = vals.map((v, i) => {
      const x = pad + (i / (vals.length - 1)) * (w - 2 * pad);
      const y = h - pad - ((v - min) / range) * (h - 2 * pad);
      return [x, y];
    });
    const ptsStr = pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    const area = ptsStr + " " + (w - pad) + "," + (h - pad) + " " + pad + "," + (h - pad);
    let segs = "";
    for (let i = 0; i < pts.length - 1; i++) {
      const c = PROFILE_COLORS[grades[i]] ?? fallbackColor;
      segs += '<line x1="' + pts[i][0].toFixed(1) + '" y1="' + pts[i][1].toFixed(1) +
        '" x2="' + pts[i + 1][0].toFixed(1) + '" y2="' + pts[i + 1][1].toFixed(1) +
        '" stroke="' + c + '" stroke-width="2.5" stroke-linecap="round"></line>';
    }
    return '<div class="profile">' +
      '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
      '<polygon points="' + area + '" fill="#9ca3af" opacity="0.14"></polygon>' + segs +
      "</svg>" +
      '<div class="profile-range"><span>' + Math.round(min) + " m</span><span>" + Math.round(max) + " m</span></div>" +
      "</div>";
  }

  // Valeurs OSM du tag surface=* -> libelle francais (valeur inconnue : affichee telle quelle)
  const SURFACE_FR = {
    asphalt: "Asphalte", paved: "Revêtu", concrete: "Béton", "concrete:plates": "Dalles béton",
    "concrete:lanes": "Dalles béton", paving_stones: "Pavés plats", sett: "Pavés",
    cobblestone: "Pavés", unhewn_cobblestone: "Pavés bruts", compacted: "Terre compactée",
    fine_gravel: "Gravier fin", gravel: "Gravier", unpaved: "Non revêtu", dirt: "Terre",
    ground: "Terre", earth: "Terre", grass: "Herbe", sand: "Sable", wood: "Bois", metal: "Métal",
    rock: "Roche", pebblestone: "Galets", mud: "Boue", grass_paver: "Pavés enherbés",
    woodchips: "Copeaux", tartan: "Tartan", clay: "Argile", bricks: "Briques",
  };

  // "asphalt:85,sett:15" -> "Asphalte 85 % · Pavés 15 %" (chaine vide : rien d'affiche)
  function surfaceHtml(str) {
    if (!str) return "";
    const single = str.indexOf(",") === -1;
    const parts = str.split(",").map((part) => {
      const [key, pct] = part.split(":");
      const label = SURFACE_FR[key] || key.replace(/_/g, " ");
      return single ? label : label + " " + pct + " %";
    });
    return '<div class="surface"><span class="label">revêtement</span>' + parts.join(" · ") + "</div>";
  }

  function selectClimb(f, opts) {
    opts = opts || {};
    selectedId = f.id;
    map.setFilter("climbs-halo", ["==", ["get", "idx"], f.properties.idx]);

    if (!opts.skipFly) {
      map.fitBounds(lineBounds(f.geometry), {
        padding: narrow()
          ? { top: 70, right: 30, bottom: 260, left: 30 }
          : { top: 60, right: 300, bottom: 180, left: 60 },
        maxZoom: 16,
        duration: 800,
      });
    }

    const p = f.properties;
    detailEl.style.borderLeftColor = p.color;
    detailEl.innerHTML =
      '<div class="name">' + p.name + "</div>" +
      '<div class="stats">' +
      '<div class="stat"><b style="color:' + p.color + '">' + p.avg_grade.toFixed(1) + '%</b><span>pente</span></div>' +
      '<div class="stat"><b>' + p.length_m + '</b><span>longueur</span></div>' +
      '<div class="stat"><b>+' + p.elev_gain_m + '</b><span>deniv.</span></div>' +
      "</div>" +
      surfaceHtml(p.surface) +
      profileSvg(p.profile, p.profile_grades, p.color);
    detailEl.classList.add("show");
    // mobile : la fiche prend la place de la liste, qui se replie sur son en-tete
    if (narrow() && panelEl.style.display === "flex") setPanelCollapsed(true);
    updateSheetOffset();
  }

  function clearSelection() {
    map.setFilter("climbs-halo", ["==", ["get", "idx"], -1]);
    detailEl.classList.remove("show");
    selectedId = null;
  }

  // Les lignes font 2.5 px : impossible de les viser au doigt. On cherche donc
  // dans un carre autour du point touche (plus large au tactile) et on garde la
  // cote la plus proche du point.
  function distToLinePx(point, geometry) {
    const lines = geometry.type === "MultiLineString" ? geometry.coordinates : [geometry.coordinates];
    let best = Infinity;
    for (const line of lines) {
      let prev = null;
      for (const c of line) {
        const q = map.project(c);
        if (prev) {
          const dx = q.x - prev.x, dy = q.y - prev.y;
          const len2 = dx * dx + dy * dy;
          let t = len2 ? ((point.x - prev.x) * dx + (point.y - prev.y) * dy) / len2 : 0;
          t = Math.max(0, Math.min(1, t));
          best = Math.min(best, Math.hypot(point.x - (prev.x + t * dx), point.y - (prev.y + t * dy)));
        }
        prev = q;
      }
    }
    return best;
  }

  function climbAt(point, touch) {
    const r = touch ? 22 : 6;
    const feats = map.queryRenderedFeatures(
      [[point.x - r, point.y - r], [point.x + r, point.y + r]], { layers: ["climbs-line"] });
    let best = null, bestD = Infinity;
    for (const f of feats) {
      const d = distToLinePx(point, f.geometry);
      if (d < bestD) { best = f; bestD = d; }
    }
    return best;
  }

  map.on("click", (e) => {
    if (selecting) return;
    const f = climbAt(e.point, e.originalEvent && e.originalEvent.pointerType === "touch"
      || window.matchMedia("(pointer: coarse)").matches);
    if (f) selectClimb(f); else clearSelection();
  });

  // --- filtre global par revetement ---
  // Barre de pastilles : aucune pastille active = pas de filtre ("Tout").
  // Filtre sur le revetement DOMINANT de la cote (1er de la chaine
  // "asphalt:85,sett:15"). La selection de zone passe par queryRenderedFeatures
  // sur la couche filtree : elle ne compte donc que les cotes visibles.
  const SURFACE_CATS = [
    { key: "asphalt", label: "Asphalte", color: "#4b5563",
      values: ["asphalt", "paved", "concrete", "concrete:plates", "concrete:lanes"] },
    { key: "sett", label: "Pavés", color: "#b45309",
      values: ["sett", "cobblestone", "paving_stones", "unhewn_cobblestone", "bricks"] },
    { key: "gravel", label: "Gravier", color: "#a8a29e",
      values: ["gravel", "fine_gravel", "compacted", "pebblestone"] },
    { key: "dirt", label: "Terre", color: "#92400e",
      values: ["unpaved", "dirt", "ground", "earth", "grass", "sand", "mud", "grass_paver", "woodchips", "clay", "rock"] },
    { key: "other", label: "Autre", color: "#7c3aed", values: null }, // tout le reste (bois, metal...)
    { key: "unknown", label: "Non renseigné", color: "#d1d5db", values: [""] },
  ];
  const chipsEl = document.getElementById("chips");
  const activeSurfaces = new Set();

  chipsEl.innerHTML =
    '<button class="chip on" data-key="">Tout</button>' +
    SURFACE_CATS.map((c) =>
      '<button class="chip" data-key="' + c.key + '"><span class="dot" style="background:' + c.color + '"></span>' + c.label + "</button>").join("");

  function applySurfaceFilter() {
    chipsEl.querySelectorAll(".chip").forEach((el) => {
      const k = el.dataset.key;
      el.classList.toggle("on", k === "" ? activeSurfaces.size === 0 : activeSurfaces.has(k));
    });
    if (!map.getLayer("climbs-line")) return;

    let filter = null;
    if (activeSurfaces.size) {
      const s = ["to-string", ["coalesce", ["get", "surface"], ""]];
      const sep = ["index-of", ":", s];
      const first = ["slice", s, 0, ["case", [">=", sep, 0], sep, ["length", s]]];
      const yes = [], no = [];
      for (const c of SURFACE_CATS) if (c.values) (activeSurfaces.has(c.key) ? yes : no).push(...c.values);
      const expr = ["match", first];
      if (yes.length) expr.push(yes, true);
      if (no.length) expr.push(no, false);
      expr.push(activeSurfaces.has("other"));
      filter = expr;
    }
    map.setFilter("climbs-line", filter);
    // la selection / la liste de zone en cours ne correspondent plus a ce qui est affiche
    clearSelection();
    document.getElementById("panel-close").click();
  }

  chipsEl.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const k = chip.dataset.key;
    if (k === "") activeSurfaces.clear();
    else if (activeSurfaces.has(k)) activeSurfaces.delete(k);
    else activeSurfaces.add(k);
    if (activeSurfaces.size === SURFACE_CATS.length) activeSurfaces.clear(); // tout coche = pas de filtre
    applySurfaceFilter();
  });

  // --- selection de zone (glisser un rectangle) ---
  // A bas zoom (France entiere), tippecanoe masque une grande partie des cotes
  // pour respecter les limites de taille des tuiles (cf --drop-densest-as-needed) :
  // une selection a ce niveau donnerait un classement faux/incomplet. On
  // n'active donc la selection qu'a partir du niveau departement, et on plafonne
  // la taille de la zone dessinee au meme ordre de grandeur.
  const MIN_SELECT_ZOOM = 9;
  const MAX_SELECT_KM = 130; // ~ plus grand departement francais (Gironde)

  const selectBtn = document.getElementById("select-btn");
  const rectEl = document.getElementById("select-rect");
  const selectMsgEl = document.getElementById("select-msg");
  const panelEl = document.getElementById("panel");
  const panelSubEl = document.getElementById("panel-sub");
  const panelListEl = document.getElementById("panel-list");

  let selecting = false;
  let dragStart = null;
  let activePointer = null;
  let selectMsgTimer = null;

  function flashSelectMsg(text) {
    selectMsgEl.textContent = text;
    selectMsgEl.style.display = "block";
    clearTimeout(selectMsgTimer);
    selectMsgTimer = setTimeout(() => { selectMsgEl.style.display = "none"; }, 3500);
  }

  function selectionAllowed() {
    return map.getZoom() >= MIN_SELECT_ZOOM;
  }

  function updateSelectBtnState() {
    const allowed = selectionAllowed();
    selectBtn.classList.toggle("disabled", !allowed);
    selectBtn.title = allowed ? "" : "Zoomez au niveau departement pour selectionner une zone";
  }

  const narrow = () => window.matchMedia("(max-width: 640px)").matches;
  const idleLabel = () => (narrow() ? "⬛ Zone" : "⬛ Selectionner une zone");
  const activeLabel = () => (narrow() ? "Dessinez..." : "Glissez sur la carte...");
  selectBtn.textContent = idleLabel();

  function cancelSelecting() {
    selecting = false;
    dragStart = null;
    activePointer = null;
    rectEl.style.display = "none";
    selectBtn.classList.remove("active");
    selectBtn.textContent = idleLabel();
    map.dragPan.enable();
    map.getCanvas().style.cursor = "";
    map.getCanvasContainer().style.touchAction = "";
  }

  updateSelectBtnState();
  map.on("zoom", () => {
    updateSelectBtnState();
    if (selecting && !selectionAllowed()) {
      cancelSelecting();
      flashSelectMsg("Zoom trop faible : selection annulee.");
    }
  });

  selectBtn.addEventListener("click", () => {
    if (!selecting && !selectionAllowed()) {
      flashSelectMsg("Zoomez au niveau departement pour selectionner une zone (le filtrage a bas zoom ne montre pas toutes les cotes).");
      return;
    }
    selecting = !selecting;
    selectBtn.classList.toggle("active", selecting);
    selectBtn.textContent = selecting ? activeLabel() : idleLabel();
    map.dragPan[selecting ? "disable" : "enable"]();
    map.getCanvas().style.cursor = selecting ? "crosshair" : "";
    // sans ca le navigateur tactile garde le geste pour lui (scroll/zoom) et
    // envoie pointercancel au lieu de nous laisser dessiner le rectangle
    map.getCanvasContainer().style.touchAction = selecting ? "none" : "";
    if (selecting && narrow()) flashSelectMsg("Faites glisser un doigt sur la carte pour dessiner la zone.");
  });

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  const canvas = map.getCanvasContainer();

  // Pointer Events : souris, doigt et stylet passent par le meme chemin.
  canvas.addEventListener("pointerdown", (e) => {
    if (!selecting || activePointer !== null) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    activePointer = e.pointerId;
    dragStart = { x: e.clientX, y: e.clientY };
    rectEl.style.left = e.clientX + "px";
    rectEl.style.top = e.clientY + "px";
    rectEl.style.width = "0px";
    rectEl.style.height = "0px";
    rectEl.style.display = "block";
  });

  window.addEventListener("pointermove", (e) => {
    if (!selecting || !dragStart || e.pointerId !== activePointer) return;
    const x = Math.min(dragStart.x, e.clientX);
    const y = Math.min(dragStart.y, e.clientY);
    rectEl.style.left = x + "px";
    rectEl.style.top = y + "px";
    rectEl.style.width = Math.abs(e.clientX - dragStart.x) + "px";
    rectEl.style.height = Math.abs(e.clientY - dragStart.y) + "px";
  });

  window.addEventListener("pointercancel", (e) => {
    if (selecting && e.pointerId === activePointer) {
      cancelSelecting();
      flashSelectMsg("Selection interrompue, reessayez.");
    }
  });

  window.addEventListener("pointerup", (e) => {
    if (!selecting || !dragStart || e.pointerId !== activePointer) return;
    const mapRect = map.getContainer().getBoundingClientRect();
    const p1 = [dragStart.x - mapRect.left, dragStart.y - mapRect.top];
    const p2 = [e.clientX - mapRect.left, e.clientY - mapRect.top];

    // fin du mode selection (usage "one-shot")
    cancelSelecting();

    if (Math.abs(p2[0] - p1[0]) < 8 || Math.abs(p2[1] - p1[1]) < 8) return;

    const ll1 = map.unproject(p1);
    const ll2 = map.unproject(p2);
    const widthKm = haversineKm(ll1.lat, ll1.lng, ll1.lat, ll2.lng);
    const heightKm = haversineKm(ll1.lat, ll1.lng, ll2.lat, ll1.lng);
    if (widthKm > MAX_SELECT_KM || heightKm > MAX_SELECT_KM) {
      flashSelectMsg("Zone trop grande (max ~" + MAX_SELECT_KM + " km, echelle departement). Dessinez une zone plus petite.");
      return;
    }

    const feats = map.queryRenderedFeatures([p1, p2], { layers: ["climbs-line"] });
    const byIdx = new Map();
    for (const f of feats) byIdx.set(f.properties.idx, f);
    showZonePanel(Array.from(byIdx.values()));
  });

  function setPanelCollapsed(collapsed) {
    panelEl.classList.toggle("collapsed", collapsed);
    updateSheetOffset();
  }

  // hauteur occupee par la feuille en bas (mobile) : la fiche d'une cote se
  // positionne au-dessus via la variable CSS --sheet-h
  function updateSheetOffset() {
    const open = narrow() && panelEl.style.display === "flex";
    document.documentElement.style.setProperty("--sheet-h", open ? panelEl.offsetHeight + "px" : "0px");
  }

  // la feuille change de hauteur (contenu, repli, affichage) : on suit tout
  // avec un ResizeObserver plutot que de penser a rappeler updateSheetOffset
  new ResizeObserver(updateSheetOffset).observe(panelEl);
  window.addEventListener("resize", updateSheetOffset);

  document.getElementById("panel-header").addEventListener("click", (e) => {
    if (!narrow() || e.target.id === "panel-close") return;
    setPanelCollapsed(!panelEl.classList.contains("collapsed"));
  });

  function showZonePanel(feats) {
    feats.sort((a, b) => b.properties.elev_gain_m - a.properties.elev_gain_m);
    const ids = feats.map((f) => f.properties.idx);
    map.setFilter("climbs-zone", ["in", ["get", "idx"], ["literal", ids]]);
    map.setPaintProperty("climbs-line", "line-opacity", ids.length
      ? ["case", ["in", ["get", "idx"], ["literal", ids]], 0.9, 0.12]
      : 0.85);

    panelEl.style.display = "flex";
    panelEl.classList.remove("collapsed");
    updateSheetOffset();
    if (!feats.length) {
      panelSubEl.textContent = "0 cote dans cette zone";
      panelListEl.innerHTML = '<div id="panel-empty">Aucune cote ici. Essayez une zone plus large.</div>';
      return;
    }
    const totalDplus = feats.reduce((s, f) => s + f.properties.elev_gain_m, 0);
    panelSubEl.textContent = feats.length + " cotes · Σ D+ " + Math.round(totalDplus) + " m";
    panelListEl.innerHTML = feats.map((f, i) => {
      const p = f.properties;
      return '<li data-idx="' + p.idx + '">' +
        '<span class="rank" style="background:' + p.color + '">' + (i + 1) + "</span>" +
        '<div><div class="name">' + p.name + "</div>" +
        '<div class="stats">' + p.avg_grade.toFixed(1) + "% · " + p.length_m + " m · <b>+" + p.elev_gain_m + " m</b></div>" +
        "</div></li>";
    }).join("");
    panelListEl.querySelectorAll("li").forEach((li, i) => {
      li.addEventListener("click", () => selectClimb(feats[i]));
    });
  }

  document.getElementById("panel-close").addEventListener("click", () => {
    panelEl.style.display = "none";
    updateSheetOffset();
    map.setFilter("climbs-zone", ["in", ["get", "idx"], ["literal", []]]);
    map.setPaintProperty("climbs-line", "line-opacity", 0.85);
  });
</script>
</body>
</html>
