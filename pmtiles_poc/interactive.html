<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PMTiles POC interactif - Cote a cote</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #status {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.95); padding: 6px 14px; border-radius: 8px;
    font-size: 13px; z-index: 9999; box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  #detail {
    position: fixed; bottom: 24px; right: 15px; z-index: 9999;
    width: 260px; padding: 16px 20px; border-radius: 14px;
    background: rgba(255,255,255,0.96); box-shadow: 0 14px 45px rgba(15,23,42,0.28);
    border-left: 6px solid transparent;
    opacity: 0; transform: translateY(14px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  #detail.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #detail .name { font-size: 17px; font-weight: 800; margin-bottom: 10px; }
  #detail .stats { display: flex; gap: 18px; }
  #detail .stat b { display: block; font-size: 20px; }
  #detail .stat span { font-size: 10px; color: #6b7280; text-transform: uppercase; }
</style>
</head>
<body>
<div id="status">chargement...</div>
<div id="detail"></div>
<div id="map"></div>
<script>
  const pmProtocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", pmProtocol.tile);

  const map = new maplibregl.Map({
    container: "map",
    center: [0.686, 47.394],
    zoom: 12.5,
    style: {
      version: 8,
      glyphs: "https://fonts.openmaptiles.org/{fontstack}/{range}.pbf",
      sources: {
        basemap: {
          type: "raster",
          tiles: ["https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png"],
          tileSize: 256,
          attribution: "&copy; OpenStreetMap &copy; CARTO",
        },
        climbs: {
          type: "vector",
          url: "pmtiles://climbs.pmtiles",
          promoteId: "idx",
        },
      },
      layers: [
        { id: "basemap", type: "raster", source: "basemap" },
        {
          id: "climbs-line",
          type: "line",
          source: "climbs",
          "source-layer": "climbs",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: {
            "line-color": ["get", "color"],
            "line-width": [
              "case",
              ["boolean", ["feature-state", "hover"], false], 6,
              3,
            ],
            "line-opacity": 0.85,
          },
        },
        {
          id: "climbs-halo",
          type: "line",
          source: "climbs",
          "source-layer": "climbs",
          layout: { "line-cap": "round", "line-join": "round" },
          filter: ["==", ["get", "idx"], -1],
          paint: { "line-color": ["get", "color"], "line-width": 13, "line-opacity": 0.32 },
        },
      ],
    },
  });

  const statusEl = document.getElementById("status");
  const detailEl = document.getElementById("detail");

  let hoveredId = null;
  let selectedId = null;

  map.on("load", () => {
    statusEl.textContent = "pret - survolez ou cliquez une cote";
  });

  map.on("mousemove", "climbs-line", (e) => {
    if (!e.features.length) return;
    map.getCanvas().style.cursor = "pointer";
    const f = e.features[0];
    if (hoveredId !== null && hoveredId !== f.id) {
      map.setFeatureState({ source: "climbs", sourceLayer: "climbs", id: hoveredId }, { hover: false });
    }
    hoveredId = f.id;
    map.setFeatureState({ source: "climbs", sourceLayer: "climbs", id: hoveredId }, { hover: true });
  });

  map.on("mouseleave", "climbs-line", () => {
    map.getCanvas().style.cursor = "";
    if (hoveredId !== null) {
      map.setFeatureState({ source: "climbs", sourceLayer: "climbs", id: hoveredId }, { hover: false });
    }
    hoveredId = null;
  });

  function lineBounds(geometry) {
    const lines = geometry.type === "MultiLineString" ? geometry.coordinates : [geometry.coordinates];
    let minLng = Infinity, minLat = Infinity, maxLng = -Infinity, maxLat = -Infinity;
    for (const line of lines) {
      for (const [lng, lat] of line) {
        if (lng < minLng) minLng = lng;
        if (lng > maxLng) maxLng = lng;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
      }
    }
    return [[minLng, minLat], [maxLng, maxLat]];
  }

  map.on("click", "climbs-line", (e) => {
    if (!e.features.length) return;
    const f = e.features[0];
    selectedId = f.id;
    map.setFilter("climbs-halo", ["==", ["get", "idx"], f.properties.idx]);

    map.fitBounds(lineBounds(f.geometry), {
      padding: { top: 60, right: 300, bottom: 180, left: 60 },
      maxZoom: 16,
      duration: 800,
    });

    const p = f.properties;
    detailEl.style.borderLeftColor = p.color;
    detailEl.innerHTML =
      '<div class="name">' + p.name + "</div>" +
      '<div class="stats">' +
      '<div class="stat"><b style="color:' + p.color + '">' + p.avg_grade.toFixed(1) + '%</b><span>pente</span></div>' +
      '<div class="stat"><b>' + p.length_m + '</b><span>longueur</span></div>' +
      '<div class="stat"><b>+' + p.elev_gain_m + '</b><span>deniv.</span></div>' +
      "</div>";
    detailEl.classList.add("show");
  });

  map.on("click", (e) => {
    const feats = map.queryRenderedFeatures(e.point, { layers: ["climbs-line"] });
    if (feats.length === 0) {
      map.setFilter("climbs-halo", ["==", ["get", "idx"], -1]);
      detailEl.classList.remove("show");
      selectedId = null;
    }
  });
</script>
</body>
</html>
